server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Limit rozmiaru żądania (ochrona przed dużymi payloadami)
    client_max_body_size 10m;

    # --- Nagłówki bezpieczeństwa dla aplikacji webowej (skanowane przez securityheaders.com) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # HSTS — działa tylko po HTTPS (gdy front stoi za Caddy/reverse proxy z TLS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP dopasowane do MUI/Emotion (style wstrzykiwane inline) i Vite
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # Proxy do backendu FastAPI (ten sam origin → brak CORS)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback — każda ścieżka frontu wraca do index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache dla statyków z hashem w nazwie
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
