# Nakładka: wystawienie WMS po HTTP na przekierowanym porcie VPS (bez Caddy, bez HTTPS).
# Szybki test panelu webowego. UWAGA: bez HTTPS telefon (iOS) raczej się nie połączy.
#
# Ustaw w .env.prod: PUBLIC_DOMAIN=twoj-serwer.example.com oraz HTTP_PORT=20308 (lub inny).
#
# Użycie (na serwerze, w katalogu projektu):
#   docker compose -f docker-compose.prod.yml -f docker-compose.http.yml --env-file .env.prod \
#     up -d --build db backend frontend
#
# Następnie: http://${PUBLIC_DOMAIN}:${HTTP_PORT}

services:
  frontend:
    ports:
      - "${HTTP_PORT:-20308}:80"

  backend:
    environment:
      TRUSTED_HOSTS: ${PUBLIC_DOMAIN}
      CORS_ORIGINS: http://${PUBLIC_DOMAIN}:${HTTP_PORT:-20308}
      CORS_ALLOW_LOCALHOST_REGEX: "false"
      CORS_ALLOW_LAN: "false"
      HSTS_ENABLED: "false"
      DEBUG: "false"
